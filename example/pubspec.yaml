name: flutter_paystack_example
description: Demonstrates how to use the flutter_paystack plugin.
version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_paystack:
    path: ../

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
